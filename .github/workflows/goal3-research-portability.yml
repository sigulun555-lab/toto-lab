name: GOAL3 research portability
on:
  pull_request:
    paths:
      - "research/goal3_k6_k10_2026-11-10/**"
      - "verification/goal3_independent/**"
      - "requirements-research.txt"
      - ".github/workflows/goal3-research-portability.yml"
permissions:
  contents: read
jobs:
  research-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify frozen inputs and code manifest
        run: python -I research/goal3_k6_k10_2026-11-10/analysis.py --verify-only
      - name: Test gradient mask and optimizer contract
        run: python -I -m unittest discover -s verification/goal3_independent -p "test_*.py"
      - name: Reproduce retrospective outer evaluation
        run: python -I research/goal3_k6_k10_2026-11-10/analysis.py --output-dir "$RUNNER_TEMP/goal3-k6-k10-output"
