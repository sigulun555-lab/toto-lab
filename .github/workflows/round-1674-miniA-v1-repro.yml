name: Round 1674 mini toto A V1 reproduction
on:
  push:
    branches:
      - 'gpt/miniA-round-1674-v1-20261124T0110JST'
    paths:
      - 'tools/generate_round_1674_miniA_v1.js'
      - 'tests/round-1674-miniA-v1-generation.test.js'
      - '.github/workflows/round-1674-miniA-v1-repro.yml'
  pull_request:
    branches:
      - 'data/round-1674-schedule'
    paths:
      - 'predictions/round_1674_ChatGPT_miniA.jsonl'
      - 'reports/round_1674_miniA_v1_manifest.json'
      - 'tools/generate_round_1674_miniA_v1.js'
      - 'tests/round-1674-miniA-v1-generation.test.js'
      - '.github/workflows/round-1674-miniA-v1-repro.yml'
permissions:
  contents: read
jobs:
  generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/gpt
          ref: 1e10fa09da1a9dc71feb2ab6e4d1f09cf16dfaef
          path: gpt-source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/toto-lab
          ref: e5ca5ff2bc08119b9bc591daa282130513d5098b
          path: toto13-source
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate from the pinned exported GPT function
        run: node tools/generate_round_1674_miniA_v1.js
      - name: Product-specific and schema tests
        run: node --test tests/round-1674-miniA-v1-generation.test.js
      - name: Repository tests
        run: npm test
      - name: Team dictionary validation
        run: npm run check:teams
      - uses: actions/upload-artifact@v4
        with:
          name: round-1674-miniA-v1-generated
          path: |
            predictions/round_1674_ChatGPT_miniA.jsonl
            reports/round_1674_miniA_v1_manifest.json
          if-no-files-found: error
          retention-days: 30
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/gpt
          ref: 1e10fa09da1a9dc71feb2ab6e4d1f09cf16dfaef
          path: gpt-source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/toto-lab
          ref: e5ca5ff2bc08119b9bc591daa282130513d5098b
          path: toto13-source
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce committed rows byte-for-byte
        run: node tools/generate_round_1674_miniA_v1.js --verify
      - name: Product-specific and schema tests
        run: node --test tests/round-1674-miniA-v1-generation.test.js
      - name: Repository tests
        run: npm test
      - name: Team dictionary validation
        run: npm run check:teams
