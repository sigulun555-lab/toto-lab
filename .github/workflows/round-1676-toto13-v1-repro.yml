name: Round 1676 toto13 V1 reproducible generation
# Re-run after the branch-only prediction snapshot commit to verify the saved bytes.
on:
  push:
    branches:
      - gpt/toto13-round-1676-v1-20261128T1905JST
permissions:
  contents: write
  actions: read
concurrency:
  group: round-1676-toto13-v1-reproduction
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout toto-lab prediction branch
        uses: actions/checkout@v4
      - name: Checkout pinned GPT model and history
        uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/gpt
          ref: 38d03bcf8e42b22b26ec16de9886848a00f95fb7
          path: gpt-input
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repository regression tests
        run: npm test
      - name: Check canonical team dictionary
        run: npm run check:teams
      - name: Generate and provenance-check toto13 V1 using actual GPT predict()
        run: node scripts/repro/round-1676-toto13-v1-repro.js
      - name: Save V1 snapshot to this dedicated branch only
        env:
          EXPECTED_BRANCH: gpt/toto13-round-1676-v1-20261128T1905JST
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "sigulun555-lab/toto-lab"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          mkdir -p predictions reports
          cp artifacts/round_1676_toto13_v1/predictions.jsonl predictions/round_1676_ChatGPT_shared_score_v1.jsonl
          cp artifacts/round_1676_toto13_v1/manifest.json reports/round_1676_toto13_v1_manifest_20261128T1905JST.json
          node scripts/repro/round-1676-toto13-v1-repro.js
          node --test tests/round-1676-toto13-v1.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/round_1676_ChatGPT_shared_score_v1.jsonl reports/round_1676_toto13_v1_manifest_20261128T1905JST.json
          if git diff --cached --quiet; then
            echo "Saved V1 snapshot already matches the pinned generator; no new commit required."
          else
            changed="$(git diff --cached --name-only | sort | tr '\n' ' ')"
            test "$changed" = "predictions/round_1676_ChatGPT_shared_score_v1.jsonl reports/round_1676_toto13_v1_manifest_20261128T1905JST.json "
            git commit -m "predictions: save round 1676 toto13 V1 snapshot"
            git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          fi
      - name: Upload reproducible V1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: round-1676-toto13-v1-${{ github.run_id }}
          path: artifacts/round_1676_toto13_v1/
          if-no-files-found: error
          retention-days: 14
