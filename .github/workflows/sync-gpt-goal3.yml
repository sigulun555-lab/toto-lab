name: Sync GPT GOAL3 forecasts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-gpt-goal3
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toto-lab
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout GPT source
        uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/gpt
          ref: main
          path: gpt-source
          persist-credentials: false
      - name: Restore existing sync PR snapshots before append
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/sync-gpt-goal3 >/dev/null 2>&1; then
            git fetch --no-tags origin automation/sync-gpt-goal3
            while IFS= read -r file; do
              case "$file" in
                predictions/*_ChatGPT_goal3.jsonl)
                  mkdir -p "$(dirname "$file")"
                  tmp_branch="$(mktemp)"
                  git show "FETCH_HEAD:$file" > "$tmp_branch"
                  if [ -f "$file" ]; then
                    # Union merge: keep every line already on main, then add lines
                    # that exist only on the sync branch. Never drop a line.
                    tmp_union="$(mktemp)"
                    cat "$file" "$tmp_branch" | awk 'NF && !seen[$0]++' > "$tmp_union"
                    mv "$tmp_union" "$file"
                  else
                    mv "$tmp_branch" "$file"
                  fi
                  rm -f "$tmp_branch"
                  ;;
              esac
            done < <(git ls-tree -r --name-only FETCH_HEAD -- predictions)
          else
            echo "No existing sync PR branch; starting from main."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize latest GOAL3 snapshot append-only
        run: node scripts/sync_gpt_goal3.js gpt-source/data/predictions.json predictions
      - name: Test synchronization logic
        run: node tests/test_sync_gpt_goal3.js
      - name: Run repository regression tests on synchronized data
        run: npm test
      - name: Check canonical team dictionary
        run: npm run check:teams
      - name: Create or update sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-gpt-goal3
          delete-branch: false
          commit-message: 'sync: append latest GPT GOAL3 forecast snapshot'
          title: 'sync: latest GPT totoGOAL3 forecast'
          body: |
            Automated append-only synchronization from sigulun555-lab/gpt main data/predictions.json.
            Original snapshots are preserved, source probabilities are copied without recalculation, and CI must pass before merge.
          add-paths: |
            predictions/*_ChatGPT_goal3.jsonl
