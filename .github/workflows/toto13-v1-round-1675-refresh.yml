name: Round 1675 toto13 V1 refreshed-history reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - reports/round_1675_history_source_20261126T022833JST.csv
      - reports/round_1675_history_source_manifest_20261126T022833JST.json
      - scripts/repro/round-1675-toto13-v1-refresh.js
      - predictions/round_1675_ChatGPT_shared_score_v1_revision_20261126T022833JST.jsonl
      - reports/round_1675_toto13_v1_revision_manifest_20261126T022833JST.json
      - tests/round-1675-toto13-v1-refresh.test.js
      - reports/round_1675_v1_revision_review_notes.md
      - reports/round_1675_v1_revision_ci_repro_note.md
      - .github/workflows/toto13-v1-round-1675-refresh.yml

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/toto-lab
          ref: ec5b8a05f8b8833f7556f147696758487c0a5df7
          path: prior-input
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sigulun555-lab/gpt
          ref: a678a296a13eea4beec142083107e69ffda2fed4
          path: gpt-input
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repository tests
        run: npm test
      - name: Team dictionary check
        run: npm run check:teams
      - name: Reproduce refreshed V1 revision using pinned exported model
        env:
          PREDICTION_GENERATED_AT: '2026-11-25T17:35:38.560Z'
        run: node scripts/repro/round-1675-toto13-v1-refresh.js
      - name: Copy generated append-only revision into PR branch workspace
        run: |
          mkdir -p predictions reports
          cp tmp/round_1675_toto13_v1_revision_20261126T022833JST.jsonl predictions/round_1675_ChatGPT_shared_score_v1_revision_20261126T022833JST.jsonl
          cp tmp/round_1675_toto13_v1_revision_manifest_20261126T022833JST.json reports/round_1675_toto13_v1_revision_manifest_20261126T022833JST.json
      - name: Validate saved revision and provenance
        run: node --test tests/round-1675-toto13-v1-refresh.test.js
      - name: Upload exact revision output and manifest
        uses: actions/upload-artifact@v4
        with:
          name: round-1675-toto13-v1-refresh-reproduction
          path: |
            predictions/round_1675_ChatGPT_shared_score_v1_revision_20261126T022833JST.jsonl
            reports/round_1675_toto13_v1_revision_manifest_20261126T022833JST.json
          if-no-files-found: error
      - name: Commit only the new revision files to this PR branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add predictions/round_1675_ChatGPT_shared_score_v1_revision_20261126T022833JST.jsonl reports/round_1675_toto13_v1_revision_manifest_20261126T022833JST.json
          if git diff --cached --quiet; then
            echo 'Revision files already match the reproducible output.'
          else
            git commit -m 'predictions: save round 1675 toto13 V1 append-only revision'
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
